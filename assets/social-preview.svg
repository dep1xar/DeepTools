<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="DeepTools — Windows tweaker, cleaner and gaming optimizer">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080E18"/>
      <stop offset="0.55" stop-color="#0D1626"/>
      <stop offset="1" stop-color="#12203A"/>
    </linearGradient>
    <linearGradient id="logo2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2EE6A8"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid2" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7DD3FC" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg2)"/>
  <rect width="1280" height="640" fill="url(#grid2)"/>
  <ellipse cx="1080" cy="80" rx="520" ry="360" fill="url(#glow2)"/>
  <ellipse cx="140" cy="600" rx="420" ry="280" fill="url(#glow2)" opacity="0.35"/>

  <g transform="translate(96 92)">
    <rect width="112" height="112" rx="28" fill="url(#logo2)"/>
    <rect x="3" y="3" width="106" height="106" rx="25" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>
    <path d="M35 29h26c21 0 35 12 35 27s-14 27-35 27H35V29zm18 16v22h8c11 0 17-4 17-11s-6-11-17-11h-8z" fill="#06121C"/>
    <path d="M76 19l-14 24h11l-8 22 20-28H72l9-18z" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <text x="236" y="168" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="84" font-weight="700" letter-spacing="-2">DeepTools</text>
  <text x="240" y="212" fill="#2EE6A8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="3">WINDOWS TWEAKER · CLEANER · GAMING OPTIMIZER</text>

  <text x="96" y="322" fill="#E2E8F0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="32" font-weight="600">Clean the junk. Tune the system. Watch the temps.</text>
  <text x="96" y="366" fill="#94A3B8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24">One portable .exe for Windows 10 / 11 — no installer, no background leftovers, open source.</text>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="21" fill="#CBD5E1">
    <g transform="translate(96 440)">
      <rect width="250" height="72" rx="18" fill="#0F1B2D" stroke="#1E3A5F"/>
      <text x="24" y="44" fill="#2EE6A8">♻</text>
      <text x="60" y="44">Junk cleanup</text>
    </g>
    <g transform="translate(366 440)">
      <rect width="250" height="72" rx="18" fill="#0F1B2D" stroke="#1E3A5F"/>
      <text x="24" y="44" fill="#2EE6A8">⚡</text>
      <text x="60" y="44">Gaming boost</text>
    </g>
    <g transform="translate(636 440)">
      <rect width="250" height="72" rx="18" fill="#0F1B2D" stroke="#1E3A5F"/>
      <text x="24" y="44" fill="#2EE6A8">❤</text>
      <text x="60" y="44">Sensors &amp; SMART</text>
    </g>
    <g transform="translate(906 440)">
      <rect width="278" height="72" rx="18" fill="#0F1B2D" stroke="#1E3A5F"/>
      <text x="24" y="44" fill="#2EE6A8">▣</text>
      <text x="60" y="44">Screenshots &amp; clicker</text>
    </g>
  </g>

  <text x="96" y="580" fill="#64748B" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" letter-spacing="1">github.com/dep1xar/DeepTools</text>
</svg>
