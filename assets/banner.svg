<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="DeepTools — Windows tweaker, cleaner and gaming optimizer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A101C"/>
      <stop offset="0.55" stop-color="#0D1626"/>
      <stop offset="1" stop-color="#111C30"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2EE6A8"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2EE6A8" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#2EE6A8" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7DD3FC" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1280" height="400" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#grid)"/>
    <ellipse cx="1120" cy="30" rx="360" ry="260" fill="url(#glow)"/>
    <ellipse cx="120" cy="390" rx="280" ry="180" fill="url(#glow)" opacity="0.4"/>

    <!-- decorative performance bars -->
    <g opacity="0.9">
      <rect x="1030" y="238" width="22" height="72" rx="11" fill="url(#bar)"/>
      <rect x="1066" y="206" width="22" height="104" rx="11" fill="url(#bar)"/>
      <rect x="1102" y="182" width="22" height="128" rx="11" fill="url(#bar)"/>
      <rect x="1138" y="150" width="22" height="160" rx="11" fill="url(#bar)"/>
      <rect x="1174" y="118" width="22" height="192" rx="11" fill="url(#bar)"/>
    </g>

    <!-- logo mark -->
    <g transform="translate(80 148)">
      <rect width="104" height="104" rx="26" fill="url(#logo)"/>
      <rect x="3" y="3" width="98" height="98" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>
      <path d="M32 26h24c20 0 33 11 33 26s-13 26-33 26H32V26zm17 15v22h7c10 0 16-4 16-11s-6-11-16-11h-7z" fill="#06121C"/>
      <path d="M70 18l-13 22h10l-7 20 18-26H67l8-16z" fill="#FFFFFF" opacity="0.95"/>
    </g>

    <!-- wordmark -->
    <text x="214" y="212" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="86" font-weight="700" letter-spacing="-2">DeepTools</text>
    <rect x="218" y="236" width="72" height="4" rx="2" fill="#2EE6A8"/>
    <text x="306" y="242" fill="#94A3B8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="2.6">WINDOWS TWEAKER · CLEANER · GAMING OPTIMIZER</text>
    <text x="218" y="286" fill="#64748B" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" letter-spacing="1.2">Windows 10 / 11   ·   One portable .exe   ·   No installer   ·   Open source</text>
  </g>
</svg>
