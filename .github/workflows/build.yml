name: Build and Release DeepTools

# Сборка на каждый push в main/master и на pull request.
# Пуш тега собирает exe и создаёт релиз с простым описанием:
# хеш коммита и список изменений.
on:
  push:
    branches: [ main, master ]
    tags: [ '**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Нужна история и теги, чтобы собрать список изменений от прошлого релиза.
          fetch-depth: 0

      - name: Build
        shell: powershell
        run: |
          # Публичный адрес статистики не секрет: он всё равно вшит в exe.
          # Ключ просмотра сюда не передаём — DeepToolsStats.exe в CI не публикуется.
          powershell -ExecutionPolicy Bypass -File build.ps1 -TelemetryUrl "https://deeptools-telemetry.pages.dev"

      - name: Show built version
        shell: powershell
        run: |
          $v = (Get-Item DeepTools.exe).VersionInfo
          Write-Host "FileVersion:    $($v.FileVersion)"
          Write-Host "ProductVersion: $($v.ProductVersion)"

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $m = [regex]::Match($tag, '(\d+)\.(\d+)(\.(\d+))?')
          if (-not $m.Success) {
            Write-Host "Тег '$tag' без номера версии - сверять нечего, продолжаем"
            exit 0
          }
          $patch = if ($m.Groups[4].Success) { $m.Groups[4].Value } else { '0' }
          $want = "$($m.Groups[1].Value).$($m.Groups[2].Value).$patch"
          $exe = (Get-Item DeepTools.exe).VersionInfo.FileVersion
          if ($exe -notlike "$want.*") {
            Write-Host "::error::В exe версия $exe, а тег $tag. Обнови AssemblyInfo.cs и пересобери."
            exit 1
          }
          Write-Host "Версия совпадает: тег $tag, exe $exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "DeepTools-${{ github.run_number }}"
          path: DeepTools.exe
          if-no-files-found: error

      - name: Prepare plain release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $prev = git describe --tags --abbrev=0 "${tag}^" 2>$null
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($prev)) {
            $range = $tag
          } else {
            $range = "$prev..$tag"
          }

          $changes = (git log $range --pretty=format:"%h %s") -join "`n"
          $body = "Commit: ${{ github.sha }}`n`nChanges:`n$changes"

          $path = Join-Path $PWD "release-notes.txt"
          [IO.File]::WriteAllText($path, $body, [Text.UTF8Encoding]::new($false))
          Get-Content $path

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: "DeepTools ${{ github.ref_name }}"
          body_path: release-notes.txt
          generate_release_notes: false
          files: DeepTools.exe
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: false
